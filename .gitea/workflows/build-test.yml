name: build-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24-04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pytest
      - run: pytest tests/ -q
      - name: CLI roundtrip check
        run: |
          python -m pycw -t "cq cq de bd8cmn" -s 20 -n 700 -r 16000 -o /tmp/t.wav
          test "$(python -m pycw -d /tmp/t.wav)" = "cq cq de bd8cmn"
