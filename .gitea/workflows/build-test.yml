name: build-test

on:
  push:
    branches: [main]
  pull_request:

env:
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple   # pip: Tsinghua mirror

jobs:
  test:
    runs-on: ubuntu-24-04
    steps:
      # actions/checkout is mirrored locally on this Gitea and works offline
      - uses: actions/checkout@v4
      - name: Bootstrap python (apt via Tsinghua mirror, no setup-python)
        run: |
          set -e
          sed -i 's|http://archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sed -i 's|http://archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true
          apt-get update -qq
          apt-get install -y -qq python3 python3-venv python3-pip
          python3 -m venv /opt/venv
      - name: Install deps (numpy + pytest via Tsinghua PyPI)
        run: /opt/venv/bin/pip install --quiet numpy pytest
      - name: Decoder tests (golden parity, round trips, no-torch guard)
        run: /opt/venv/bin/python -m pytest tests/ -q
      - name: CLI roundtrip check
        run: |
          /opt/venv/bin/python -m pycw -t "cq cq de bd8cmn" -s 20 -n 700 -r 16000 -o /tmp/t.wav
          test "$(/opt/venv/bin/python -m pycw -d /tmp/t.wav)" = "cq cq de bd8cmn"